spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/login_jwt_db}
    username: ${SPRING_DATASOURCE_USERNAME:login_jwt_user}
    password: ${SPRING_DATASOURCE_PASSWORD:login_jwt_pass}
  jpa:
    hibernate:
      ddl-auto: update
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

verification-code:
  # Tempo de validade dos códigos de verificação (cadastro e recuperação de senha), em segundos
  expiration-seconds: ${VERIFICATION_CODE_EXPIRATION_SECONDS:60}

jwt:
  secret: ${JWT_SECRET:change-me-in-production-this-should-be-a-long-random-string}
  access-expiration: ${JWT_ACCESS_EXPIRATION:900000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}
